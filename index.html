<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Costo puesto en depósito: calculadora de importación e Incoterms</title>
  <meta name="description" content="Calculá el costo real de importar, por unidad: valor en aduana, derechos, tasa de estadística, IVA y percepciones, con cualquier Incoterm 2020. Gratis, en tu navegador.">
  <meta property="og:title" content="Landed cost calculator / Calculadora de costo de importación">
  <meta property="og:description" content="Customs value, duties, VAT and per-unit landed cost for any Incoterm 2020. Free and private: runs in your browser.">
  <meta property="og:type" content="website">
  <meta name="theme-color" content="#1B2A3A">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="assets/fonts/archivo-latin-wdth-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip" href="#result" data-i18n="result">Resultado</a>

  <header class="masthead">
    <div class="masthead-inner">
      <h1 data-i18n="title">Costo puesto en depósito</h1>
      <p class="tagline" data-i18n="tagline"></p>
    </div>
    <button type="button" class="lang" id="lang" data-i18n="langSwitch">English</button>
  </header>

  <main class="calc">
    <form id="form" class="inputs" autocomplete="off" novalidate>
      <fieldset class="group">
        <legend data-i18n="quote">La cotización</legend>
        <div class="row-2">
          <label class="field">
            <span data-i18n="price">Precio del proveedor</span>
            <span class="money"><span class="cur" aria-hidden="true">US$</span><input id="price" name="price" inputmode="decimal" required></span>
            <small data-i18n="priceHint"></small>
          </label>
          <label class="field">
            <span data-i18n="quantity">Unidades</span>
            <input id="quantity" name="quantity" inputmode="numeric">
          </label>
        </div>
        <div class="field">
          <span id="incoterm-label" data-i18n="incoterm">Incoterm</span>
          <div class="terms" id="incoterm" role="radiogroup" aria-labelledby="incoterm-label"></div>
        </div>
      </fieldset>

      <fieldset class="group">
        <legend data-i18n="journey">El viaje</legend>
        <p class="hint" data-i18n="journeyHint"></p>
        <ol class="stages" id="stages"></ol>
        <label class="check">
          <input type="checkbox" id="insMode">
          <span data-i18n="insuranceRate"></span>
        </label>
        <label class="field inline" id="insRateField" hidden>
          <span class="money pct"><input id="insRate" inputmode="decimal" aria-describedby="insRateHint"><span class="cur" aria-hidden="true">%</span></span>
          <small id="insRateHint" data-i18n="insuranceRateHint"></small>
        </label>
      </fieldset>

      <fieldset class="group">
        <legend data-i18n="taxes">Tributos</legend>
        <div class="row-2">
          <label class="field">
            <span data-i18n="preset">Régimen</span>
            <select id="preset"></select>
          </label>
          <div class="field">
            <span id="valuation-label" data-i18n="valuation"></span>
            <div class="seg" role="radiogroup" aria-labelledby="valuation-label">
              <label><input type="radio" name="valuation" value="CIF"><span>CIF</span></label>
              <label><input type="radio" name="valuation" value="FOB"><span>FOB</span></label>
            </div>
          </div>
        </div>
        <div class="taxes" id="taxes"></div>
        <label class="check">
          <input type="checkbox" id="creditTaxes">
          <span><span data-i18n="creditTaxes"></span><small data-i18n="creditTaxesHint"></small></span>
        </label>
      </fieldset>

      <fieldset class="group">
        <legend data-i18n="extras">Opcional</legend>
        <div class="row-2">
          <label class="field">
            <span data-i18n="fxRate"></span>
            <input id="fx" inputmode="decimal">
          </label>
          <label class="field">
            <span data-i18n="margin"></span>
            <input id="margin" inputmode="decimal">
          </label>
        </div>
      </fieldset>
    </form>

    <aside class="result" id="result" aria-live="polite" tabindex="-1">
      <h2 class="visually-hidden" data-i18n="result">Resultado</h2>
      <div class="headline">
        <p class="label" data-i18n="landed">Costo puesto en depósito</p>
        <p class="big" id="outLanded">—</p>
        <p class="unit"><span id="outPerUnit">—</span> <span data-i18n="perUnit">por unidad</span></p>
        <p class="local" id="outLocal" hidden></p>
      </div>

      <figure class="stack-wrap">
        <figcaption data-i18n="breakdownTitle"></figcaption>
        <div class="stack" id="stack" role="img"></div>
        <ul class="legend" id="legend"></ul>
      </figure>

      <dl class="figures" id="figures"></dl>

      <details class="tax-detail">
        <summary data-i18n="taxDetail"></summary>
        <p class="note" id="ddpNote" hidden data-i18n="paidBySeller"></p>
        <table>
          <thead><tr><th scope="col"></th><th scope="col" data-i18n="rate"></th><th scope="col" data-i18n="base"></th><th scope="col" data-i18n="amount"></th></tr></thead>
          <tbody id="taxTable"></tbody>
        </table>
      </details>

      <div class="actions">
        <button type="button" id="share" data-i18n="share">Copiar enlace</button>
        <button type="button" id="csv" data-i18n="csv">Descargar CSV</button>
        <button type="button" id="print" data-i18n="print">Imprimir</button>
        <button type="button" id="reset" class="quiet" data-i18n="reset">Empezar de nuevo</button>
      </div>
      <p class="disclaimer" data-i18n="disclaimer"></p>
    </aside>
  </main>

  <section class="explorer" id="explorer" aria-labelledby="explorer-title">
    <div class="explorer-head">
      <h2 id="explorer-title" data-i18n="explorerTitle">Quién paga qué</h2>
      <p data-i18n="explorerIntro"></p>
    </div>
    <div class="terms terms-big" id="explorerTerms" role="radiogroup" aria-labelledby="explorer-title"></div>
    <div class="route" id="route"></div>
    <div class="term-text">
      <p class="term-name" id="termName"></p>
      <p id="termText"></p>
      <p class="mode" id="termMode"></p>
    </div>
  </section>

  <footer class="foot">
    <p data-i18n="footer"></p>
  </footer>

  <div class="minibar" id="minibar" aria-hidden="true">
    <span id="miniLanded">—</span>
    <span id="miniUnit">—</span>
  </div>
  <div class="toast" id="toast" role="status" hidden></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
